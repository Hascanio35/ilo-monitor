<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b121b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="/icons/favicon-64.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="iLO Monitor">
<meta name="application-name" content="iLO Monitor">
<title>iLO Monitor</title>
<style>
:root{
 --bg:#0b121b;--panel:#12202c;--panel2:#152532;--line:#263b4b;
 --text:#edf4f8;--muted:#91a5b7;--green:#19e6a1;--green2:#09ae7c;
 --blue:#45a8ff;--amber:#ffbd3d;--red:#ff5b67;--purple:#a77cff;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;max-width:100%;overflow-x:hidden;overflow-x:clip;background:var(--bg);color:var(--text);
 font-family:Inter,"Segoe UI",Arial,sans-serif;
 -webkit-text-size-adjust:100%;text-size-adjust:100%}
body{-webkit-tap-highlight-color:rgba(25,230,161,.15)}
body{font-size:13px}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
a{color:var(--blue)}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.app{display:flex;min-height:100vh}

/* ---------- sidebar ---------- */
.sidebar{width:195px;flex:0 0 195px;background:#0d1722;border-right:1px solid #1d3040;
 position:fixed;inset:0 auto 0 0;z-index:10}
.logo{height:76px;padding:15px 18px;border-bottom:1px solid #1d3040;display:flex;
 align-items:center;gap:12px}
.logoMark{width:35px;height:15px;border:2px solid var(--green);
 box-shadow:0 0 9px rgba(25,230,161,.25)}
.logoText{line-height:12px;font-weight:800;font-size:12px;letter-spacing:-.3px}
.logoText span{display:block}
.nav{padding:17px 0}
.nav button{width:100%;border:0;background:transparent;color:#b8c6d2;text-align:left;
 padding:12px 18px;display:flex;gap:14px;align-items:center;border-left:3px solid transparent}
.nav button:hover{background:#12222e;color:#fff}
.nav button.active{background:linear-gradient(90deg,rgba(25,230,161,.16),rgba(25,230,161,.05));
 color:var(--green);border-left-color:var(--green)}
.navIcon{width:19px;text-align:center;font-size:16px;display:inline-flex;align-items:center;justify-content:center}
.navIcon svg,.bell svg,.kpiIcon svg,.serverGlyph svg{display:block}
.kpiIcon svg{width:.85em;height:.85em}
.version{position:absolute;left:18px;bottom:18px;color:#718596;font-size:11px;line-height:16px}

/* ---------- header ---------- */
.content{margin-left:195px;width:calc(100% - 195px);min-width:0}
.header{height:76px;border-bottom:1px solid #1d3040;background:#0e1823;display:flex;
 align-items:center;justify-content:space-between;padding:0 17px 0 20px;position:relative}
.headLeft h1{font-size:22px;margin:0 0 2px;letter-spacing:.1px}
.headLeft p{margin:0;color:var(--muted);font-size:12px}
.headRight{display:flex;align-items:center;gap:18px}
.searchWrap{position:relative}
.searchWrap:before{content:"⌕";position:absolute;left:13px;top:5px;font-size:23px;color:#b7c5d0}
.search{width:265px;height:38px;border:1px solid #2b4052;background:#101d29;border-radius:7px;
 color:#fff;padding:0 12px 0 38px;outline:none}
.bell{font-size:21px;color:var(--green);position:relative;background:none;border:0;padding:0}
.bell b{position:absolute;right:-9px;top:-8px;background:#f04c5b;color:#fff;border-radius:20px;
 font-size:10px;padding:3px 6px;font-weight:700}
.bell b.zero{display:none}
.user{display:flex;align-items:center;gap:9px}
.avatar{width:27px;height:27px;border-radius:50%;background:#718298;display:grid;
 place-items:center;color:#dfe7ee;font-weight:700}
.user span{font-size:12px}
.refresh{border:1px solid #2a4051;background:#13202c;color:#dce7ed;border-radius:7px;padding:8px 12px}
.refresh:hover{border-color:#466277}
.refresh.busy{opacity:.55;pointer-events:none}
.timer{position:absolute;right:18px;top:56px;font-size:10px;color:#90a5b7;background:#111f2b;
 border:1px solid #263a4a;border-radius:12px;padding:5px 10px}
main{padding:18px 14px 40px}

/* ---------- kpi ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:16px}
.kpi{min-width:0;min-height:114px;border:1px solid var(--line);border-radius:9px;padding:14px 16px;
 background:var(--panel);position:relative;overflow:hidden}
.kpi:after{content:"";position:absolute;inset:auto -30px -50px auto;width:120px;height:120px;
 border-radius:50%;background:rgba(25,230,161,.035)}
.kpi.green{background:linear-gradient(120deg,rgba(25,230,161,.11),var(--panel) 70%)}
.kpi.blue{background:linear-gradient(120deg,rgba(69,168,255,.11),var(--panel) 70%)}
.kpi.purple{background:linear-gradient(120deg,rgba(167,124,255,.13),var(--panel) 70%)}
.kpiTop{display:flex;align-items:center;gap:13px}
.kpiIcon{width:54px;height:54px;border-radius:8px;background:rgba(25,230,161,.12);display:grid;
 place-items:center;font-size:28px;color:var(--green);flex:0 0 54px}
.blue .kpiIcon{background:rgba(69,168,255,.12);color:var(--blue)}
.purple .kpiIcon{background:rgba(167,124,255,.14);color:var(--purple)}
.amber .kpiIcon{background:rgba(255,189,61,.14);color:var(--amber)}
.red .kpiIcon{background:rgba(255,91,103,.14);color:var(--red)}
.kpiValue{font-size:25px;font-weight:800;line-height:27px}
.kpiLabel{font-size:13px;color:#d9e4ea;margin-top:3px}
.kpiSub{margin-top:10px;color:var(--muted);font-size:11px}
.sep{opacity:.45;margin:0 5px}
.oktxt{color:var(--green)}.warntxt{color:var(--amber)}.redtxt{color:var(--red)}
.infotxt{color:var(--blue)}

/* ---------- layout ---------- */
.workspace{display:grid;grid-template-columns:minmax(560px,34%) minmax(0,1fr);
 gap:14px;align-items:start}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:9px;overflow:hidden}
.panelHead{min-height:53px;border-bottom:1px solid var(--line);padding:8px 14px;display:flex;
 align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.panelHead h2{font-size:16px;margin:0}
.add{background:var(--green2);color:#fff;border:0;border-radius:7px;padding:9px 13px;font-weight:600}
.add:hover{background:#0ac68d}

/* ---------- tabelle ---------- */
.dataTable{width:100%;border-collapse:collapse}
.dataTable th,.dataTable td{padding:10px 12px;border-bottom:1px solid var(--line);
 text-align:left;font-size:11.5px;vertical-align:middle}
.dataTable th{font-size:10px;color:#8ea5b8;font-weight:500;white-space:nowrap;
 position:sticky;top:0;background:var(--panel);z-index:1}
.dataTable tbody tr:last-child td{border-bottom:0}
.serverList .dataTable{table-layout:fixed}
.serverList .scrollY{overflow-x:hidden}
.serverList th,.serverList td{padding:10px 8px}
.serverList th:nth-child(1){width:27%}.serverList th:nth-child(2){width:19%}
.serverList th:nth-child(3){width:15%}.serverList th:nth-child(4){width:10%}
.serverList th:nth-child(5){width:11%}.serverList th:nth-child(6){width:18%}
.serverList td{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.serverList td:nth-child(4),.serverList td:nth-child(5){text-align:right}
.serverList th:nth-child(4),.serverList th:nth-child(5){text-align:right}
.rowActions{text-align:right;overflow:visible!important}
.iconBtn svg,.srvCardActions svg,.action svg,.refresh svg{display:inline-block;vertical-align:-2px}
.refresh svg{font-size:15px;vertical-align:-3px}
.iconBtn{background:#1b2b39;border:1px solid #304657;color:#cfdce6;
 border-radius:5px;width:26px;height:24px;font-size:12px;line-height:1;
 padding:0;margin-left:3px}
.iconBtn:hover{border-color:var(--green);color:var(--green)}
.iconBtn:disabled{opacity:.3;cursor:not-allowed}
.iconBtn:disabled:hover{border-color:#304657;color:#cfdce6}
.serverRow{cursor:pointer}
.serverRow:hover{background:rgba(25,230,161,.07)}
.serverRow.selected{background:rgba(25,230,161,.09);outline:1px solid var(--green);outline-offset:-1px}
.serverName{font-weight:700;font-size:11px}
.ip{color:#7790a4;font-size:10px;margin-top:2px}
.state{display:inline-flex;align-items:center;gap:5px}
.stateDot{width:8px;height:8px;border-radius:50%;background:var(--green);flex:0 0 8px}
.stateDot.warn{background:var(--amber)}.stateDot.bad{background:var(--red)}
.stateDot.off{background:#6b8095}
.scrollY{max-height:420px;overflow:auto}
.resizer{height:12px;cursor:ns-resize;display:flex;align-items:center;justify-content:center;
 border-top:1px solid var(--line);touch-action:none;user-select:none}
.resizer span{width:42px;height:4px;border-radius:2px;background:#33495b;transition:background .15s}
.resizer:hover span,.resizer.attiva span{background:var(--green)}
body.ridimensiona{cursor:ns-resize;user-select:none}
.eventsPanel{margin-top:14px}
.sevWarn{color:var(--amber)}.sevInfo{color:var(--blue)}.sevBad{color:var(--red)}
.nowrap{white-space:nowrap}

/* ---------- dettaglio ---------- */
.detail{min-width:0}
.detailHead{padding:13px 14px;border-bottom:1px solid var(--line);display:flex;
 align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.detailTitle{display:flex;gap:13px;align-items:center;min-width:0}
.serverGlyph{font-size:28px;color:#d7e4ed}
.detailName{font-size:21px;font-weight:800;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.detailMeta{color:#a0b1c0;margin-top:5px;font-size:11px}
.badge{display:inline-block;border-radius:5px;padding:4px 8px;font-weight:700;font-size:11px}
.badge.ok{background:rgba(25,230,161,.16);color:var(--green)}
.badge.warn{background:#f5ad20;color:#16120a}
.badge.bad{background:var(--red);color:#fff}
.badge.off{background:#2b3d4c;color:#a8bccd}
.actions{display:flex;gap:8px;position:relative}
.action{background:#1b2b39;color:#e5edf2;border:1px solid #304657;border-radius:6px;padding:8px 11px}
.action:hover{border-color:#466277}
.action.green{background:var(--green2);border-color:var(--green2);color:#fff}
.action.green:hover{background:#0ac68d}
.action.danger{color:#ff8a92;border-color:#4a2b31}
.action.danger:hover{background:#31191d}
.menu{position:absolute;right:0;top:42px;background:#16253244;background:#162532;
 border:1px solid #31485a;border-radius:8px;min-width:220px;z-index:60;padding:6px;
 box-shadow:0 14px 40px rgba(0,0,0,.5)}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;color:#dbe6ee;
 padding:9px 11px;border-radius:6px;font-size:12px}
.menu button:hover{background:#1e3040}
.menu button.danger{color:#ff8a92}
.menu hr{border:0;border-top:1px solid #2a3f50;margin:5px 2px}
.tabs{min-height:45px;border-bottom:1px solid var(--line);display:flex;padding-left:10px;overflow-x:auto;
 scrollbar-width:none;-ms-overflow-style:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;color:#a8b8c5;padding:12px 17px;white-space:nowrap;
 border-bottom:3px solid transparent}
.tabs button:hover{color:#fff}
.tabs button.active{color:var(--green);border-bottom-color:var(--green)}
.detailBody{padding:13px}
.miniGrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px;margin-bottom:13px}
.mini{min-width:0;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:11px;min-height:84px}
.miniTitle{font-size:11px;color:#b9c8d3}
.miniValue{font-size:20px;font-weight:800;margin-top:8px;line-height:24px}
.miniSub{font-size:10px;color:var(--muted);margin-top:4px}
.detailGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.box{background:var(--panel2);border:1px solid var(--line);border-radius:8px;overflow:hidden;min-width:0}
.boxHead{min-height:45px;border-bottom:1px solid var(--line);display:flex;align-items:center;
 justify-content:space-between;padding:10px 12px;font-size:13px;font-weight:700;gap:8px}
.boxLink{color:var(--blue);font-size:10px;font-weight:500;background:none;border:0;padding:0}
.boxLink:hover{text-decoration:underline}
.boxBody{padding:8px 12px}
.boxBody.flush{padding:0;overflow-x:auto}
.line{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;
 border-bottom:1px solid var(--line);font-size:11px}
.line:last-child{border-bottom:0}
.line .val{display:flex;align-items:center;gap:8px;white-space:nowrap}
/* Nomi lunghi dei sensori: una riga sola, con i puntini, invece di
   andare a capo una parola per riga quando il riquadro e' stretto. */
.line > span:first-child{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;
 text-overflow:ellipsis}
.line .val{flex:0 0 auto}
.detailGrid .bar{width:64px;flex-basis:64px}
.bar{height:9px;width:105px;border-radius:5px;background:#293a49;overflow:hidden;flex:0 0 105px}
.bar i{display:block;height:100%;border-radius:5px;background:var(--green)}
.bar i.warn{background:var(--amber)}.bar i.bad{background:var(--red)}
.tempVal{font-weight:700;color:var(--green)}
.tempVal.warn{color:var(--amber)}.tempVal.bad{color:var(--red)}
.statusOk{color:var(--green)}.statusWarn{color:var(--amber)}.statusBad{color:var(--red)}
.infoTable{width:100%;border-collapse:collapse}
.infoTable td{padding:7px 0;border-bottom:1px solid var(--line);font-size:11px}
.infoTable tr:last-child td{border-bottom:0}
.infoTable td:first-child{color:#9fb0be}
.infoTable td:last-child{text-align:right;word-break:break-word}
.thermalStrip{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:7px}
.thermalItem{min-height:51px;background:#172633;border:1px solid #2a4050;border-radius:6px;
 padding:6px 9px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.thermalItem small{display:block;color:#8fa4b5;font-size:9px;white-space:nowrap;overflow:hidden;
 text-overflow:ellipsis;max-width:95px}
.thermalItem strong{font-size:15px;color:var(--green)}
.thermalItem strong.warn{color:var(--amber)}.thermalItem strong.bad{color:var(--red)}
.fullPanel{margin-top:12px}
.empty{padding:26px 14px;text-align:center;color:#8fa4b5;font-size:12px}
.apiError{display:flex;align-items:center;justify-content:space-between;gap:14px;
 background:rgba(255,91,103,.10);border:1px solid rgba(255,91,103,.45);border-radius:9px;
 padding:12px 14px;margin-bottom:14px;font-size:12px;color:#ffd0d4}
.apiError b{display:block;color:#ff8a92;font-size:13px;margin-bottom:3px}
.apiError span{overflow-wrap:anywhere}
.apiError .action{flex:0 0 auto}
.empty b{display:block;color:#c3d2dd;font-size:13px;margin-bottom:5px}

/* ---------- pagine ---------- */
.pageToolbar{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;
 margin-bottom:12px;flex-wrap:wrap}
.pageToolbar h2{margin:0;font-size:17px}
.pageToolbar .sub{color:var(--muted);font-size:11px;margin-top:3px}
.toolbarControls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.field{background:#101d29;border:1px solid #2b4052;color:#fff;border-radius:6px;
 padding:8px 10px;outline:none}
.field:focus{border-color:var(--green)}
input.field::placeholder{color:#6f8598}
.chart{width:100%;height:160px;display:block}
.chartLegend{display:flex;gap:14px;flex-wrap:wrap;font-size:10px;color:var(--muted);
 padding:4px 0 2px}
.chartLegend i{display:inline-block;width:9px;height:3px;border-radius:2px;margin-right:5px;
 vertical-align:middle}
.heatGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px}
.heatCell{border-radius:6px;padding:8px 7px;min-height:58px;display:flex;flex-direction:column;
 justify-content:space-between;border:1px solid rgba(255,255,255,.06)}
.heatCell small{font-size:9px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.heatCell b{font-size:14px}

/* ---------- dischi di tutti i server ---------- */
.lifeCell{display:flex;align-items:center;gap:9px;white-space:nowrap}
.lifeCell .bar{width:70px;flex:0 0 70px}
.lifeCell b{min-width:38px;text-align:right;font-size:12px}
.lifeNa{color:#7f95a8;font-size:11px;white-space:nowrap}
.lifeNa.lifeOver{cursor:help;text-decoration:underline dotted}
.serialTxt{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;
 color:#c3d2dd;white-space:nowrap}
.subLine{font-size:10.5px;color:#7f95a8;margin-top:2px}
.codice{background:#0b141c;border:1px solid #2b4052;border-radius:6px;padding:9px 11px;
 margin:8px 0;font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#d6e4ee;
 white-space:pre-wrap;overflow-wrap:anywhere;user-select:all}
.fonteWin{display:inline-block;font-size:9.5px;padding:1px 5px;border-radius:4px;
 background:rgba(69,168,255,.14);color:#8ecbff;vertical-align:1px;margin-left:4px;
 font-weight:600;letter-spacing:.2px}
.hintBox{background:rgba(255,189,61,.08);border:1px solid rgba(255,189,61,.35);
 border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:11.5px;line-height:17px;
 color:#e9dcc0}
.hintBox b{color:var(--amber)}
.drvMeta .serialTxt,.drvMeta{white-space:normal}
.linkBtn{background:none;border:0;padding:0;color:#e7f0f6;font:inherit;font-weight:600;
 cursor:pointer;text-align:left}
.linkBtn:hover{color:var(--green);text-decoration:underline}
.driveCards{display:none}
.drvCard{padding:11px 13px 11px 12px;border-bottom:1px solid var(--line);
 border-left:3px solid #2f5a7a}
.drvCard:last-child{border-bottom:0}
.drvCard.warn{border-left-color:var(--amber)}
.drvCard.bad{border-left-color:var(--red)}
.drvCard.ok{border-left-color:var(--green)}
.drvTop{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.drvTop .linkBtn{font-size:13.5px}
.drvBay{color:var(--muted);font-size:11px;white-space:nowrap}
.drvModel{font-size:12.5px;margin-top:4px;color:#e3ecf2;overflow-wrap:anywhere}
.drvMeta{font-size:10.5px;color:#7f95a8;margin-top:4px;overflow-wrap:anywhere}
.drvLife{display:flex;align-items:center;gap:9px;margin-top:8px}
.drvLife .bar{flex:1 1 auto;width:auto}
.drvLife b{font-size:13px;white-space:nowrap}
.kpi.amber{background:linear-gradient(120deg,rgba(255,189,61,.12),var(--panel) 70%)}
.kpi.red{background:linear-gradient(120deg,rgba(255,91,103,.13),var(--panel) 70%)}

/* ---------- eventi a schede (telefono) ---------- */
.eventCards{display:none}
.evCard{padding:11px 13px 11px 12px;border-bottom:1px solid var(--line);
 border-left:3px solid #3a5062}
.evCard:last-child{border-bottom:0}
.evCard.ev-sevWarn{border-left-color:var(--amber)}
.evCard.ev-sevBad{border-left-color:var(--red)}
.evCard.ev-sevInfo{border-left-color:#2f5a7a}
.evTop{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.evSev{font-size:11.5px;font-weight:600;white-space:nowrap}
.evWhen{color:var(--muted);font-size:11px;white-space:nowrap}
.evMsg{font-size:13.5px;line-height:19px;margin-top:5px;color:#e3ecf2;
 overflow-wrap:anywhere}
.evMeta{font-size:10.5px;color:#7f95a8;margin-top:5px;overflow-wrap:anywhere}

/* ---------- elenco server a schede (telefono) ---------- */
.serverCards{display:none;padding:9px}
.srvCard{background:var(--panel2);border:1px solid var(--line);
 border-radius:9px;padding:11px 12px;margin-bottom:9px}
.srvCard:last-child{margin-bottom:0}
.srvCard.selected{border-color:var(--green);
 box-shadow:0 0 0 1px rgba(25,230,161,.35)}
.srvTop{display:flex;justify-content:space-between;align-items:flex-start;
 gap:10px}
.srvTop .serverName{font-size:14px}
.srvMeta{color:#7f95a8;font-size:10.5px;margin-top:3px}
.srvStats{display:flex;gap:14px;margin-top:10px;font-size:11px;
 color:#c3d2dd;flex-wrap:wrap}
.srvStats b{font-size:14px;display:block;font-weight:700;margin-top:1px}
.srvStats span small{color:#7f95a8;font-size:9.5px;
 text-transform:uppercase;letter-spacing:.4px}
.srvCardActions{display:flex;gap:7px;margin-top:11px}
.srvCardActions button{flex:1;min-height:40px;background:#1b2b39;
 border:1px solid #304657;color:#dce7ed;border-radius:7px;font-size:12px}
.srvCardActions button:hover{border-color:var(--green)}
.srvCardActions button:disabled{opacity:.35}

/* ---------- regole di avviso ---------- */
.alertRule{border-bottom:1px solid var(--line);padding:13px 14px}
.alertRule:last-child{border-bottom:0}
.alertHead{display:flex;justify-content:space-between;align-items:center;

.alertBody{display:grid;grid-template-columns:200px minmax(0,1fr) minmax(0,1fr);gap:16px;
 align-items:start}
.alertLabel{font-size:10px;color:#8ea5b8;margin-bottom:7px}
.checkGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
 gap:6px 12px}
.checkItem{display:flex;align-items:center;gap:7px;font-size:11.5px;
 color:#cfdce6;cursor:pointer}
.checkItem input{margin:0;width:auto;accent-color:var(--green)}
.alertFoot{display:flex;justify-content:space-between;align-items:center;
 gap:12px;margin-top:12px;flex-wrap:wrap}
.alertFoot .hint{margin:0}
@media(max-width:900px){.alertBody{grid-template-columns:minmax(0,1fr)}}

/* ---------- modali ---------- */
.modal{position:fixed;inset:0;background:rgba(3,9,15,.72);display:grid;place-items:center;
 z-index:100;padding:20px}
.modalCard{width:min(660px,96vw);max-height:92vh;overflow:auto;background:var(--panel);
 border:1px solid #314858;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.modalHead{padding:17px 19px;border-bottom:1px solid var(--line);display:flex;
 justify-content:space-between;align-items:flex-start;gap:12px}
.modalHead h2{margin:0;font-size:18px}
.modalHead p{margin:5px 0 0;color:var(--muted);font-size:11px}
.modalClose{border:0;background:none;color:#aab9c5;font-size:25px;line-height:20px}
.formGrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:13px;padding:18px 19px}
.formGrid label{font-size:11px;color:#aebdca;display:block}
.formGrid .wide{grid-column:1/-1}
.formGrid input,.formGrid textarea,.formGrid select{display:block;width:100%;margin-top:6px;
 border:1px solid #304657;background:#0f1b26;color:#fff;border-radius:6px;padding:9px 10px;outline:none}
.formGrid input{height:38px}
.formGrid textarea{min-height:64px;resize:vertical}
.formGrid input:focus,.formGrid textarea:focus{border-color:var(--green)}
.hint{color:#7a8fa1;font-size:10px;margin-top:5px}
.formMessage{min-height:18px;padding:0 19px;font-size:11px;color:var(--amber);
 line-height:17px}
.formMessage b{font-size:12px}
.formMessage.ok{color:var(--green)}
.formMessage.err{color:var(--red)}
.modalActions{display:flex;justify-content:flex-end;gap:8px;padding:14px 19px;
 border-top:1px solid var(--line);margin-top:10px;flex-wrap:wrap}
.modalActions .left{margin-right:auto}
.switch{display:flex;align-items:center;gap:9px;font-size:11px;color:#aebdca;margin-top:6px}
.switch input{width:auto;height:auto;margin:0}

/* ---------- toast ---------- */
.toasts{position:fixed;right:18px;bottom:18px;z-index:200;display:flex;flex-direction:column;
 gap:8px;max-width:340px}
.toast{background:#16252f;border:1px solid #31485a;border-left:3px solid var(--green);
 border-radius:8px;padding:11px 13px;font-size:12px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.toast.err{border-left-color:var(--red)}
.toast.warn{border-left-color:var(--amber)}
.hidden{display:none!important}
.spin{display:inline-block;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin{animation:none}}

@media(max-width:1250px){
 .workspace{grid-template-columns:minmax(440px,40%) minmax(0,1fr)}
 .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
 .detailGrid{grid-template-columns:repeat(2,minmax(0,1fr))}
}

   Telefono: sotto gli 820px l'impaginazione cambia impostazione,

 .headLeft{flex:1 1 auto;min-width:0}

 /* I bersagli piccoli diventano toccabili. */

 /* I menu diventano pannelli che salgono dal basso. */

 /* Sotto i 16px iOS ingrandisce la pagina quando si tocca un campo,

<script>
"use strict";

/* ============================================================
   Stato e utilità
   ============================================================ */

const state = {
  page: "overview",
  servers: [],
  summary: {},
  selectedId: null,
  detail: null,
  tab: "overview",
  query: "",
  settings: {tempWarn: 55, tempCrit: 70, refresh: 45},
  countdown: 45,
  loading: false,
  eventFilters: {severity: "all", hours: 168, q: "", server_id: "",
                 source: "all"},
  reportHours: 24,
  drivesView: {filtro: "tutti", ordine: "vita"}
};

const $ = (id) => document.getElementById(id);
const el = (sel, root) => (root || document).querySelector(sel);
const els = (sel, root) => Array.from((root || document).querySelectorAll(sel));

function esc(v){
  return String(v ?? "").replace(/[&<>"']/g, (m) => (
    {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]
  ));
}
// Number(null) e Number("") valgono 0: un dato assente diventerebbe
// "0 W" o "0 %" invece di "non misurato".
function num(v){
  if (v === null || v === undefined || v === "") return null;
  const x = Number(v);
  return Number.isFinite(x) ? x : null;
}
function fmt(v, suffix){
  const x = num(v);
  if (x === null) return "—";
  const rounded = Math.round(x * 10) / 10;
  return rounded + (suffix || "");
}
function fmtInt(v, suffix){
  const x = num(v);
  return x === null ? "—" : Math.round(x) + (suffix || "");
}
function health(v){
  const x = String(v || "").toLowerCase();
  if (!x) return "unknown";
  if (x.includes("critical") || x.includes("fail") || x.includes("fatal")) return "bad";
  if (x.includes("warn")) return "warn";
  if (x.includes("ok") || x.includes("enabled")) return "ok";
  return "warn";
}
function tempClass(v){
  const x = num(v);
  if (x === null) return "";
  if (x >= state.settings.tempCrit) return "bad";
  if (x >= state.settings.tempWarn) return "warn";
  return "";
}
function dateLabel(v){
  if (!v) return "—";
  const d = new Date(String(v).replace(" ", "T") + (String(v).endsWith("Z") ? "" : "Z"));
  if (isNaN(d)) return esc(v);
  return d.toLocaleString("it-IT", {day:"2-digit", month:"2-digit", year:"numeric",
    hour:"2-digit", minute:"2-digit"});
}
function relative(v){
  if (!v) return "mai";
  const d = new Date(String(v).replace(" ", "T") + (String(v).endsWith("Z") ? "" : "Z"));
  if (isNaN(d)) return "—";
  const s = Math.floor((Date.now() - d.getTime()) / 1000);
  if (s < 60) return "adesso";
  if (s < 3600) return Math.floor(s / 60) + " min fa";
  if (s < 86400) return Math.floor(s / 3600) + " ore fa";
  return Math.floor(s / 86400) + " giorni fa";
}
function uptimeFrom(v){
  if (!v) return null;
  const d = new Date(String(v).replace(" ", "T") + "Z");
  if (isNaN(d)) return null;
  const days = Math.floor((Date.now() - d.getTime()) / 86400000);
  const hours = Math.floor(((Date.now() - d.getTime()) % 86400000) / 3600000);
  return {days, hours, since: d};
}
function tb(bytes){
  const x = num(bytes);
  if (x === null) return "—";
  if (x >= 1e12) return (Math.round(x / 1e12 * 10) / 10) + " TB";
  return (Math.round(x / 1e9)) + " GB";
}
// Icone in SVG: i simboli Unicode equivalenti su iOS diventano
// emoji a colori o quadratini vuoti, secondo il carattere.
const IC = {
  play: '<svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 5v14l11-7z"/></svg>',
  ext: '<svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6"/><path d="M20 4 11 13"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>',
  power: '<svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v9"/><path d="M6.3 6.3a8 8 0 1 0 11.4 0"/></svg>',
  refresh: '<svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></svg>',
  logout: '<svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h4a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-4"/><path d="M10 16l-4-4 4-4"/><path d="M6 12h10"/></svg>',
};

// La console remota HTML5 sta all'indirizzo /irc.html dell'iLO e si
// apre senza passare dalla sua interfaccia. Chiede comunque le
// credenziali: l'autenticazione passa da un cookie dell'origine
// dell'iLO, che una pagina servita da qui non puo' scrivere. Farle
// riempire al gestore password del browser e' la strada pratica.
function consoleUrl(server){
  // Gli iLO 2 e 3 non hanno la console HTML5: si apre la loro pagina,
  // da cui parte la console Java o .NET.
  if (server.ilo_protocol === "ribcl") return "https://" + server.ilo_ip + "/";
  return "https://" + server.ilo_ip + "/irc.html";
}
function hasConsole(server){
  const lic = String(server.ilo_license || "").toLowerCase();
  // In mancanza del dato non blocchiamo: meglio un pulsante che
  // forse non funziona di una funzione tolta per un campo vuoto.
  if (!lic) return true;
  return !lic.includes("standard");
}
function openConsole(server){
  window.open(consoleUrl(server), "_blank", "noopener");
}

// Un alloggiamento vuoto (State "Absent") non e' un componente: non
// va contato fra le anomalie ne' nelle medie.
function presenti(lista){
  return (lista || []).filter(
    (x) => String(x.state || "").toLowerCase() !== "absent");
}

// La generazione dell'iLO. iLO 5 e 6 la mettono nel modello; iLO 4
// lascia il modello vuoto e la scrive solo nel firmware ("iLO 4 v2.82").
function iloGen(s){
  const v = String(s.ilo_version || "");
  if (/\d/.test(v)) return v;
  const m = String(s.ilo_firmware || "").match(/iLO\s*\d/i);
  return m ? m[0] : (v || "iLO");
}

// Nell'elenco compatto "HPE ProLiant DL360 Gen10" diventa
// "DL360 Gen10": il prefisso e' uguale per tutti e ruba spazio.
function shortModel(v){
  return String(v || "").replace(/^\s*(HPE|HP)?\s*ProLiant\s*/i, "").trim();
}

function severityClass(s){
  const x = String(s || "").toUpperCase();
  if (x === "CRITICAL" || x === "FATAL") return "sevBad";
  if (x === "WARNING") return "sevWarn";
  return "sevInfo";
}
function severityIcon(s){
  const x = String(s || "").toUpperCase();
  if (x === "CRITICAL" || x === "FATAL") return "⛔";
  if (x === "WARNING") return "⚠";
  return "ⓘ";
}

function toast(message, kind){
  const node = document.createElement("div");
  node.className = "toast" + (kind ? " " + kind : "");
  node.textContent = message;
  $("toasts").appendChild(node);
  setTimeout(() => node.remove(), 5200);
}

// Oltre questo tempo la richiesta viene annullata: meglio un errore
// leggibile di una rotellina che gira per sempre.
const TIMEOUT_RICHIESTA = 30000;

/* ------------------------------------------------------------
   Aggiornamento senza ridisegno
   ------------------------------------------------------------
   Riscrivere innerHTML rifa' l'intero albero: la pagina sfarfalla,
   l'elenco torna in cima e si perde quello che si stava facendo.
   Qui confrontiamo il nuovo albero con quello presente e tocchiamo
   solo cio' che e' davvero cambiato.
   ------------------------------------------------------------ */

function aggiornaAttributi(vecchio, nuovo){
  // Un campo mentre lo si sta usando non si tocca.
  const inUso = document.activeElement === vecchio;
  for (const a of Array.from(nuovo.attributes)){
    if (inUso && (a.name === "value" || a.name === "checked")) continue;
    if (vecchio.getAttribute(a.name) !== a.value){
      vecchio.setAttribute(a.name, a.value);
    }
  }
  for (const a of Array.from(vecchio.attributes)){
    // I marcatori nostri non arrivano dall'HTML generato.
    if (a.name === "data-collegato") continue;
    if (!nuovo.hasAttribute(a.name)) vecchio.removeAttribute(a.name);
  }
}

function patch(vecchio, nuovo){
  if (vecchio.nodeType === 3 && nuovo.nodeType === 3){
    if (vecchio.nodeValue !== nuovo.nodeValue) vecchio.nodeValue = nuovo.nodeValue;
    return vecchio;
  }
  if (vecchio.nodeType !== nuovo.nodeType
      || vecchio.nodeName !== nuovo.nodeName){
    vecchio.replaceWith(nuovo);
    return nuovo;
  }
  if (vecchio.nodeType !== 1) return vecchio;

  aggiornaAttributi(vecchio, nuovo);

  // Il contenuto dei campi di testo vive nella proprieta', non
  // nell'attributo: lo lasciamo stare se l'utente ci sta scrivendo.
  if (["INPUT", "SELECT", "TEXTAREA"].includes(vecchio.nodeName)){
    if (document.activeElement !== vecchio
        && nuovo.value !== undefined && vecchio.value !== nuovo.value){
      vecchio.value = nuovo.value;
    }
    return vecchio;
  }

  const figliVecchi = Array.from(vecchio.childNodes);
  const figliNuovi = Array.from(nuovo.childNodes);
  const comuni = Math.min(figliVecchi.length, figliNuovi.length);
  for (let i = 0; i < comuni; i++) patch(figliVecchi[i], figliNuovi[i]);
  for (let i = comuni; i < figliNuovi.length; i++){
    vecchio.appendChild(figliNuovi[i]);
  }
  for (let i = figliVecchi.length - 1; i >= comuni; i--){
    figliVecchi[i].remove();
  }
  return vecchio;
}

function disegna(contenitore, html, inPlace){
  if (!inPlace || !contenitore.firstChild){
    contenitore.innerHTML = html;
    return;
  }
  const temporaneo = document.createElement("div");
  temporaneo.innerHTML = html;
  const figliVecchi = Array.from(contenitore.childNodes);
  const figliNuovi = Array.from(temporaneo.childNodes);
  const comuni = Math.min(figliVecchi.length, figliNuovi.length);
  for (let i = 0; i < comuni; i++) patch(figliVecchi[i], figliNuovi[i]);
  for (let i = comuni; i < figliNuovi.length; i++){
    contenitore.appendChild(figliNuovi[i]);
  }
  for (let i = figliVecchi.length - 1; i >= comuni; i--){
    figliVecchi[i].remove();
  }
}

// Con il ridisegno in place i nodi sopravvivono, quindi riattaccare
// i gestori li duplicherebbe: ogni nodo viene marcato una volta.
function collega(nodo, evento, fn){
  if (!nodo) return;
  const marchio = "on" + evento;
  if (nodo.dataset.collegato && nodo.dataset.collegato.includes(marchio)) return;
  nodo.dataset.collegato = (nodo.dataset.collegato || "") + marchio + " ";
  // Qui serve la registrazione vera: chiamare collega() sarebbe
  // una ricorsione che non registra nulla.
  Node.prototype.addEventListener.call(nodo, evento, fn);
}

async function api(url, options){
  const opts = Object.assign({cache: "no-store"}, options || {});
  const annulla = new AbortController();
  const scadenza = setTimeout(() => annulla.abort(), TIMEOUT_RICHIESTA);
  opts.signal = annulla.signal;
  if (opts.body && typeof opts.body !== "string"){
    opts.headers = Object.assign({"Content-Type": "application/json"}, opts.headers);
    opts.body = JSON.stringify(opts.body);
  }
  let response;
  try {
    response = await fetch(url, opts);
  } catch (err){
    clearTimeout(scadenza);
    if (err.name === "AbortError"){
      throw new Error(
        "Il server non ha risposto entro 30 secondi. Se e' in corso una "
        + "raccolta dati, riprova fra poco."
      );
    }
    throw err;
  }
  clearTimeout(scadenza);
  const text = await response.text();
  let payload = {};
  try { payload = text ? JSON.parse(text) : {}; } catch (e) { payload = {detail: text}; }
  if (response.status === 401 && !url.includes("/api/login")){
    location.href = "/login";
    throw new Error("Sessione scaduta");
  }
  if (!response.ok){
    // Una pagina HTML al posto del JSON arriva da nginx: l'API e'
    // ferma o si sta riavviando.
    const html = /^\s*</.test(text);
    const detail = payload.detail && !html ? payload.detail
      : payload.error ? payload.error
      : html || !text ? "HTTP " + response.status + (response.status >= 502
        ? " da nginx: il servizio ilo-monitor non risponde" : "")
      : text;
    throw new Error(typeof detail === "string" ? detail : JSON.stringify(detail));
  }
  return payload;
}
async function apiData(url, options){
  const payload = await api(url, options);
  return payload.data !== undefined ? payload.data : payload;
}

// Un errore qui non deve sembrare un impianto vuoto: si tiene
// l'ultimo elenco buono e si mostra il motivo in cima alla pagina.
async function loadCore(){
  const conNome = (url) => apiData(url).catch((err) => {
    throw new Error(url + ": " + err.message);
  });
  let summary, servers;
  try {
    [summary, servers] = await Promise.all([
      conNome("/api/summary"),
      conNome("/api/servers")
    ]);
  } catch (err){
    state.apiError = err.message;
    throw err;
  }
  state.apiError = null;
  state.summary = summary;
  state.servers = servers;
  if (summary.temp_warning_c) state.settings.tempWarn = Number(summary.temp_warning_c);
  if (summary.temp_critical_c) state.settings.tempCrit = Number(summary.temp_critical_c);
  if (!state.selectedId && servers.length) state.selectedId = servers[0].id;
  if (state.selectedId && !servers.some((s) => s.id === state.selectedId)){
    state.selectedId = servers.length ? servers[0].id : null;
  }
  const count = summary.events_24h || 0;
  $("bellCount").textContent = count > 99 ? "99+" : count;
  $("bellCount").classList.toggle("zero", !count);
}

async function loadDetail(force){
  if (!state.selectedId){ state.detail = null; return; }
  if (!force && state.detail && state.detail.server.id === state.selectedId) return;
  state.detail = await apiData("/api/servers/" + state.selectedId);
}

async function go(page, options){
  state.page = page;
  const meta = PAGES[page] || PAGES.overview;
  $("pageTitle").textContent = meta.title;
  $("pageSubtitle").textContent = meta.subtitle;
  els("#nav button").forEach((b) => b.classList.toggle("active", b.dataset.page === page));
  $("search").placeholder = page === "events" ? "Cerca nei messaggi..."
    : page === "drives" ? "Cerca server, modello o seriale..." : "Cerca server...";
  await render(options);
}

async function render(options){
  const root = $("pageRoot");
  const opts = options || {};
  // Aggiornamento automatico sulla stessa pagina: si rattoppa
  // l'albero esistente invece di rifarlo.
  const inPlace = Boolean(opts.silenzioso) && state.paginaDisegnata === state.page;
  state.paginaDisegnata = state.page;
  try {
    if (state.page === "overview"){
      if (!opts.keepDetail) await loadDetail();
      disegna(root, overviewPage(), inPlace);
      wireOverview();
    } else if (state.page === "servers"){
      disegna(root, serversPage(), inPlace);
      wireServersPage();
    } else if (state.page === "thermal"){
      if (!inPlace) root.innerHTML = '<div class="empty">Caricamento sensori…</div>';
      const data = await apiData("/api/thermal");
      state.settings.tempWarn = Number(data.temp_warning_c) || state.settings.tempWarn;
      state.settings.tempCrit = Number(data.temp_critical_c) || state.settings.tempCrit;
      disegna(root, thermalPage(data), inPlace);
    } else if (state.page === "drives"){
      if (!inPlace) root.innerHTML = '<div class="empty">Caricamento dischi…</div>';
      state.drivesData = await apiData("/api/drives");
      disegna(root, drivesPage(state.drivesData), inPlace);
      wireDrivesPage();
    } else if (state.page === "events"){
      root.innerHTML = eventsPageShell();
      wireEventsPage();
      await reloadEvents();
    } else if (state.page === "reports"){
      if (!inPlace) root.innerHTML = '<div class="empty">Calcolo report…</div>';
      const data = await apiData("/api/reports?hours=" + state.reportHours);
      disegna(root, reportsPage(data), inPlace);
      wireReportsPage();
    } else if (state.page === "alerts"){
      if (!inPlace) root.innerHTML = '<div class="empty">Caricamento…</div>';
      const data = await apiData("/api/alerts");
      disegna(root, alertsPage(data), inPlace);
      wireAlertsPage(data);
    } else if (state.page === "settings"){
      if (!inPlace) root.innerHTML = '<div class="empty">Caricamento impostazioni…</div>';
      const data = await apiData("/api/settings");
      disegna(root, settingsPage(data), inPlace);
      wireSettingsPage(data);
    }
  } catch (err){
    root.innerHTML = '<div class="panel"><div class="empty"><b>Caricamento non riuscito</b>'
      + esc(err.message) + '</div></div>';
  }
}

// Le pagine di configurazione contengono moduli: ridisegnarle
// mentre si scrive cancella quello che si sta digitando. Non
// mostrano dati in tempo reale, quindi non hanno nulla da aggiornare.
const PAGINE_SENZA_AUTOAGGIORNAMENTO = new Set(["alerts", "settings"]);

function autoaggiornamentoAttivo(){
  if (PAGINE_SENZA_AUTOAGGIORNAMENTO.has(state.page)) return false;
  // Neanche con una finestra aperta o un campo in uso.
  if ($("modalRoot") && $("modalRoot").innerHTML.trim()) return false;
  const attivo = document.activeElement;
  if (attivo && ["INPUT", "SELECT", "TEXTAREA"].includes(attivo.tagName)){
    return false;
  }
  return true;
}

async function refreshAll(silent){
  if (state.loading) return;
  if (silent && !autoaggiornamentoAttivo()){
    // Rimandiamo: ricontrolla al prossimo giro.
    state.countdown = state.settings.refresh;
    return;
  }
  state.loading = true;
  $("refreshBtn").classList.add("busy");
  $("refreshBtn").innerHTML = '<span class="spin">' + IC.refresh + '</span>';
  try {
    let erroreCore = null;
    try { await loadCore(); } catch (err){ erroreCore = err; }
    if (!erroreCore && (state.page === "overview" || state.page === "servers")){
      await loadDetail(true);
    }
    // Si ridisegna anche se il caricamento e' fallito, cosi' l'avviso
    // compare (e sparisce quando torna tutto a posto).
    await render({keepDetail: true, silenzioso: Boolean(silent)});
    if (erroreCore) throw erroreCore;
  } catch (err){
    if (!silent) toast("Aggiornamento non riuscito: " + err.message, "err");
  } finally {
    state.loading = false;
    $("refreshBtn").classList.remove("busy");
    $("refreshBtn").innerHTML = IC.refresh;
    state.countdown = state.settings.refresh;
    $("countdown").textContent = state.countdown;
  }
}

/* ---------- riquadri ridimensionabili ----------
   Elenco server ed eventi recenti hanno un'altezza massima: si
   allunga o accorcia trascinando la maniglia sotto il riquadro, e il
   doppio clic la adatta al contenuto. L'altezza scelta resta salvata
   in questo browser. */

const ALTEZZA_PREDEFINITA = 420;
const ALTEZZA_MINIMA = 120;

function leggiAltezze(){
  try {
    const v = JSON.parse(localStorage.getItem("ilo-altezze") || "{}");
    return v && typeof v === "object" ? v : {};
  } catch (e){ return {}; }
}
state.altezze = leggiAltezze();

function salvaAltezze(){
  try { localStorage.setItem("ilo-altezze", JSON.stringify(state.altezze)); }
  catch (e){ /* navigazione privata: vale solo per questa sessione */ }
}

function stileAltezza(nome){
  const h = state.altezze[nome];
  if (h === 0) return ' style="max-height:none"';
  return ` style="max-height:${Number(h) || ALTEZZA_PREDEFINITA}px"`;
}

function maniglia(nome){
  return `<div class="resizer" data-resizer="${nome}" role="separator"
    aria-orientation="horizontal" title="Trascina per allungare o accorciare · doppio clic: adatta al contenuto"><span></span></div>`;
}

(function(){
  let trascina = null;
  document.addEventListener("pointerdown", (ev) => {
    const handle = ev.target.closest && ev.target.closest("[data-resizer]");
    if (!handle) return;
    const nome = handle.dataset.resizer;
    const box = document.querySelector(`[data-resize="${nome}"]`);
    if (!box) return;
    ev.preventDefault();
    trascina = {nome, box, y: ev.clientY, h: box.getBoundingClientRect().height};
    handle.classList.add("attiva");
    document.body.classList.add("ridimensiona");
    try { handle.setPointerCapture(ev.pointerId); } catch (e){ /* ok */ }
  });
  document.addEventListener("pointermove", (ev) => {
    if (!trascina) return;
    const h = Math.max(ALTEZZA_MINIMA, Math.round(trascina.h + ev.clientY - trascina.y));
    trascina.box.style.maxHeight = h + "px";
    state.altezze[trascina.nome] = h;
  });
  const fine = () => {
    if (!trascina) return;
    els(".resizer.attiva").forEach((x) => x.classList.remove("attiva"));
    document.body.classList.remove("ridimensiona");
    trascina = null;
    salvaAltezze();
  };
  document.addEventListener("pointerup", fine);
  document.addEventListener("pointercancel", fine);
  document.addEventListener("dblclick", (ev) => {
    const handle = ev.target.closest && ev.target.closest("[data-resizer]");
    if (!handle) return;
    const nome = handle.dataset.resizer;
    const box = document.querySelector(`[data-resize="${nome}"]`);
    // Doppio clic: tutto il contenuto; un altro doppio clic: altezza normale.
    const tutto = state.altezze[nome] === 0;
    state.altezze[nome] = tutto ? ALTEZZA_PREDEFINITA : 0;
    if (box) box.style.maxHeight = tutto ? ALTEZZA_PREDEFINITA + "px" : "none";
    salvaAltezze();
  });
})();

  const q = state.query.toLowerCase();
  return [s.name, s.ilo_ip, s.model, s.hostname, s.serial_number, s.server_group]
    .some((v) => String(v || "").toLowerCase().includes(q));
}

function recentEventsTable(){
  return '<div class="empty" id="recentEventsBox">Caricamento eventi…</div>';
}

// Gli eventi si leggono per il messaggio. In tabella, sul telefono,
// il messaggio finisce nell'ultima colonna e va a capo una parola per
// riga; in scheda prende tutta la larghezza. Si generano entrambe e
// il CSS sceglie, cosi' ruotare il telefono non chiede di ridisegnare.
function eventCards(rows, opzioni){
  const o = opzioni || {};
  return `<div class="eventCards">${rows.map((e) => {
    const cls = severityClass(e.severity);
    const meta = [
      o.server ? esc(e.server_name || "") : "",
      o.source && e.log_source ? esc(e.log_source) : "",
      e.message_id ? esc(e.message_id) : ""
    ].filter(Boolean).join(" · ");
    return `<div class="evCard ev-${cls}">
      <div class="evTop">
        <span class="${cls} evSev">${severityIcon(e.severity)}
          ${esc(e.severity || "Informativo")}</span>
        <span class="evWhen">${dateLabel(e.event_created)}</span>
      </div>
      <div class="evMsg">${esc(e.message || "(nessun messaggio)")}</div>
      ${meta ? `<div class="evMeta">${meta}</div>` : ""}
    </div>`;
  }).join("")}</div>`;
}

async function loadRecentEvents(){
  const box = $("recentEventsBox");
  if (!box) return;
  try {
    const rows = await apiData("/api/events?hours=24&limit=10");
    if (!rows.length){
      box.outerHTML = '<div class="empty" id="recentEventsBox">'
        + 'Nessun evento nelle ultime 24 ore.</div>';
      return;
    }
    box.outerHTML = `<div id="recentEventsBox">
      <table class="dataTable eventTable">
      <thead><tr><th>Data/Ora</th><th>Server</th><th>Severità</th><th>Messaggio</th></tr></thead>
      <tbody>${rows.map((e) => `<tr>
        <td class="nowrap">${dateLabel(e.event_created)}</td>
        <td>${esc(e.server_name)}</td>
        <td class="${severityClass(e.severity)} nowrap">${severityIcon(e.severity)}
          ${esc(e.severity || "Informativo")}</td>
        <td>${esc(e.message || "")}</td></tr>`).join("")}</tbody></table>
      ${eventCards(rows, {server: true})}</div>`;
  } catch (err){
    box.textContent = "Eventi non disponibili: " + err.message;
  }
}

function tabContent(){
  const d = state.detail;
  switch (state.tab){
    case "hardware": return hardwareTab(d);
    case "thermal": return thermalTab(d);
    case "fans": return fansTab(d);
    case "power": return powerTab(d);
    case "storage": return storageTab(d);
    case "network": return networkTab(d);
    case "events": return eventsTab(d);
    case "info": return infoTab(d);
    default: return overviewTab(d);
  }
}

  return `<div class="empty">${esc(text)}</div>`;
}

        : tempClass(maxTemp) === "warn" ? "warntxt" : "oktxt"}">

      <div class="miniSub">${sensors.length ? esc(sensors[0].sensor_name) : "nessun sensore"}</div></div>

  <div class="detailGrid">

  return `<div class="grid2">

      <div class="boxBody flush">${cpus.length ? `<table class="dataTable">
        <thead><tr><th>Socket</th><th>Modello</th><th>Core</th><th>Thread</th><th>Stato</th></tr></thead>
        <tbody>${cpus.map((c) => `<tr>
          <td>${esc(c.socket || c.processor_id)}</td>
          <td>${esc(c.model || "—")}</td>
          <td>${c.total_cores ?? "—"}</td>
          <td>${c.total_threads ?? "—"}</td>
          <td class="${health(c.health) === "ok" ? "statusOk" : "statusWarn"}">

        : emptyBox("Nessun processore rilevato.")}</div></div>

    <div class="box"><div class="boxHead">Memoria
      <span class="boxLink">${dimms.length} moduli su ${slots} slot</span></div>

        <thead><tr><th>Slot</th><th>Capacità</th><th>Velocità</th><th>Tipo</th><th>Stato</th></tr></thead>
        <tbody>${dimms.map((x) => `<tr>

          <td>${fmtInt((num(x.capacity_mib) || 0) / 1024, " GB")}</td>

          <td>${esc(x.memory_type || "—")}</td>
          <td class="${health(x.health) === "ok" ? "statusOk" : "statusWarn"}">

  return `<div class="miniGrid">

  <div class="grid2">

function rowPowerMenu(server, anchor){
  closeRowMenu();

  menu.className = "menu";

  menu.innerHTML = `
    <div style="padding:6px 10px;font-size:10px;color:#7a8fa1">
      ${esc(server.name)}</div>
    <hr>
    <button data-p="on">Accendi</button>

    <button data-p="force_off">Spegnimento forzato</button>
    <hr>
    <button data-led="1">Accendi/spegni LED UID</button>`;
  // Su schermo largo il menu si aggancia al pulsante; sul telefono
  // il CSS lo trasforma in un pannello a tutta larghezza in basso,
  // quindi qui la posizione non va nemmeno calcolata.
  if (window.innerWidth > 820){
    const box = anchor.getBoundingClientRect();
    menu.style.position = "fixed";
    menu.style.top = Math.min(box.bottom + 4, window.innerHeight - 260) + "px";
    menu.style.right = (window.innerWidth - box.right) + "px";
  }
  document.body.appendChild(menu);

  els("[data-p]", menu).forEach((b) => collega(b, "click", (ev) => {
    ev.stopPropagation();
    closeRowMenu();
    powerAction(server, b.dataset.p);
  }));
  const led = el("[data-led]", menu);
  if (led) collega(led, "click", (ev) => {
    ev.stopPropagation();
    closeRowMenu();
    toggleLed(server.id);
  });
}

  if (old) old.remove();
}

function wireRowActions(){
  els("[data-console]").forEach((b) => collega(b, "click", (ev) => {

  }));
  els("[data-ilo]").forEach((b) => collega(b, "click", (ev) => {

function wireOverview(){
  wireRowActions();
  els("[data-server]").forEach((row) => {
    collega(row, "click", async (ev) => {
      const d = ev.target.dataset || {};
      if (d.console || d.ilo || d.rowmenu) return;
      state.selectedId = Number(row.dataset.server);
      state.tab = "overview";
      state.detail = null;
      await loadDetail(true);
      await render({keepDetail: true});
    });
  });
  els(".tabs [data-tab]").forEach((btn) => {
    collega(btn, "click", () => {
      state.tab = btn.dataset.tab;
      render({keepDetail: true});
    });
  });
  els("[data-tab-link]").forEach((btn) => {
    collega(btn, "click", () => {
      state.tab = btn.dataset.tabLink;
      render({keepDetail: true});
    });
  });
  wireDetailActions();
  loadPowerChart();
  loadRecentEvents();
}

function wireDetailActions(){
  const menu = $("actionMenu");
  els("[data-act]").forEach((btn) => {
    const act = btn.dataset.act;
    collega(btn, "click", async (ev) => {
      ev.stopPropagation();
      if (act === "menu"){ menu.classList.toggle("hidden"); return; }
      if (menu) menu.classList.add("hidden");
      if (act === "add-server") return openServerModal(null);
      if (act === "goto-events") return go("events");
      if (!state.detail) return;
      if (act === "edit-server") return openServerModal(state.detail.server);
      if (act === "agent-script") return openAgentModal(state.detail.server);
      if (act === "delete-server") return openDeleteModal(state.detail.server);
      if (act === "console"){
        openConsole(state.detail.server);
        return;
      }
      if (act === "open-ilo"){
        window.open("https://" + state.detail.server.ilo_ip, "_blank", "noopener");
        return;
      }
      if (act === "collect-now") return collectNow(state.detail.server.id);
      if (act === "toggle-led") return toggleLed(state.detail.server.id);
      if (act.startsWith("power-")) return powerAction(state.detail.server, act.slice(6));
    });
  });
}

/* ---------- grafico consumo ---------- */

async function loadPowerChart(){
  const box = $("powerChartBox");
  if (!box || !state.selectedId) return;
  try {
    const data = await apiData(
      "/api/servers/" + state.selectedId + "/metrics?hours=24");
    const series = (data.power || [])
      .map((r) => ({x: r.collected_at, y: num(r.consumed_watts)}))
      .filter((p) => p.y !== null);
    const label = $("powerChartLabel");
    if (!series.length){
      box.innerHTML = emptyBox("Nessuna rilevazione nelle ultime 24 ore. "
        + "Il collector registra un punto a ogni esecuzione.");
      if (label) label.textContent = "";
      return;
    }
    if (label) label.textContent = series.length + " rilevazioni";
    box.innerHTML = lineChart([{points: series, color: "#45a8ff", name: "Watt"}], "W");
  } catch (err){
    box.innerHTML = emptyBox("Grafico non disponibile: " + err.message);
  }
}

function lineChart(seriesList, unit, height){
  const W = 1000, H = height || 170, padL = 46, padR = 12, padT = 12, padB = 24;
  const all = seriesList.flatMap((s) => s.points);
  if (!all.length) return emptyBox("Nessun dato.");
  const ys = all.map((p) => p.y);
  let minY = Math.min(...ys), maxY = Math.max(...ys);
  if (minY === maxY){ minY -= 1; maxY += 1; }
  const pad = (maxY - minY) * 0.12;
  minY = Math.max(0, minY - pad); maxY = maxY + pad;

  const times = all.map((p) => new Date(String(p.x).replace(" ", "T") + "Z").getTime());
  const minX = Math.min(...times), maxX = Math.max(...times);
  const spanX = maxX - minX || 1;
  const sx = (v) => padL + ((new Date(String(v).replace(" ", "T") + "Z").getTime() - minX)
    / spanX) * (W - padL - padR);
  const sy = (v) => padT + (1 - (v - minY) / (maxY - minY)) * (H - padT - padB);

  const gridLines = [0, 0.25, 0.5, 0.75, 1].map((t) => {
    const value = minY + (maxY - minY) * (1 - t);
    const y = padT + t * (H - padT - padB);
    return `<line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}"
      stroke="#25394a" stroke-width="1"/>
      <text x="${padL - 7}" y="${y + 3.5}" fill="#7f95a8" font-size="10"
      text-anchor="end">${Math.round(value)}</text>`;
  }).join("");

  const ticks = [0, 0.5, 1].map((t) => {
    const time = new Date(minX + spanX * t);
    const x = padL + t * (W - padL - padR);
    return `<text x="${x}" y="${H - 6}" fill="#7f95a8" font-size="10"
      text-anchor="${t === 0 ? "start" : t === 1 ? "end" : "middle"}">
      ${time.toLocaleTimeString("it-IT", {hour: "2-digit", minute: "2-digit"})}</text>`;
  }).join("");

  const paths = seriesList.map((s) => {
    if (!s.points.length) return "";
    const d = s.points.map((p, idx) =>
      (idx ? "L" : "M") + sx(p.x).toFixed(1) + " " + sy(p.y).toFixed(1)).join(" ");
    const area = d + ` L ${sx(s.points[s.points.length - 1].x).toFixed(1)} ${H - padB}`
      + ` L ${sx(s.points[0].x).toFixed(1)} ${H - padB} Z`;
    return `<path d="${area}" fill="${s.color}" opacity="0.10"/>
      <path d="${d}" fill="none" stroke="${s.color}" stroke-width="2"
      stroke-linejoin="round" stroke-linecap="round"/>`;
  }).join("");

  const legend = seriesList.length > 1
    ? `<div class="chartLegend">${seriesList.map((s) =>
        `<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join("")}</div>`
    : "";

  return `${legend}<svg class="chart" viewBox="0 0 ${W} ${H}"
    preserveAspectRatio="none" role="img"
    aria-label="Andamento ${esc(unit || "")}">${gridLines}${paths}${ticks}</svg>`;
}

}

  els(".serverCards [data-server]").forEach((card) => {

      state.selectedId = Number(card.dataset.server);
      state.tab = "overview";
      state.detail = null;
      await go("overview");
    });
  });
  els("[data-open]").forEach((row) => {
    collega(row, "click", async (ev) => {
      const d = ev.target.dataset || {};
      if (d.edit || d.remove || d.console || d.ilo || d.rowmenu) return;
      state.selectedId = Number(row.dataset.open);
      state.tab = "overview";
      state.detail = null;
      await go("overview");
    });
  });
  els("[data-edit]").forEach((btn) => collega(btn, "click", (ev) => {
    ev.stopPropagation();
    const s = state.servers.find((x) => x.id === Number(btn.dataset.edit));
    openServerModal(s);
  }));
  els("[data-remove]").forEach((btn) => collega(btn, "click", (ev) => {
    ev.stopPropagation();
    const s = state.servers.find((x) => x.id === Number(btn.dataset.remove));
    openDeleteModal(s);
  }));
  els("[data-act='add-server']").forEach((b) =>

      } catch (err){ toast(err.message, "err"); }

/* ============================================================
   Pagina Mappe termiche
   ============================================================ */

function heatColor(v){
  const x = num(v);
  if (x === null) return {bg: "#1b2a37", fg: "#8fa4b5"};
  if (x >= state.settings.tempCrit) return {bg: "rgba(255,91,103,.30)", fg: "#ff8a92"};
  if (x >= state.settings.tempWarn) return {bg: "rgba(255,189,61,.26)", fg: "#ffcf72"};
  if (x >= state.settings.tempWarn * 0.7) return {bg: "rgba(25,230,161,.20)", fg: "#6ff0c4"};
  return {bg: "rgba(69,168,255,.16)", fg: "#8ecbff"};
}

function thermalPage(data){
  const sensors = data.sensors || [];
  const fans = data.fans || [];
  if (!sensors.length){
    return `<div class="panel"><div class="empty"><b>Nessun sensore disponibile</b>
      Esegui una raccolta dati per popolare le mappe termiche.</div></div>`;
  }
  const byServer = {};
  sensors.forEach((s) => {
    (byServer[s.server_name] = byServer[s.server_name] || []).push(s);
  });
  const fansByServer = {};
  presenti(fans).forEach((f) => {
    (fansByServer[f.server_name] = fansByServer[f.server_name] || []).push(f);
  });

  return `<div class="pageToolbar">
    <div><h2>Mappe termiche</h2>
      <div class="sub">${sensors.length} sensori su ${Object.keys(byServer).length} server ·
        soglie: warning ${data.temp_warning_c} °C, critical ${data.temp_critical_c} °C</div></div>
    <div class="chartLegend">
      <span><i style="background:#8ecbff"></i>fresco</span>
      <span><i style="background:#6ff0c4"></i>normale</span>
      <span><i style="background:#ffcf72"></i>warning</span>
      <span><i style="background:#ff8a92"></i>critical</span>
    </div></div>
  ${Object.entries(byServer).map(([name, list]) => {
    const sorted = list.slice().sort(
      (a, b) => (num(b.temperature_c) || 0) - (num(a.temperature_c) || 0));
    const maxT = num(sorted[0].temperature_c);
    const serverFans = fansByServer[name] || [];
    return `<div class="panel" style="margin-bottom:14px">
      <div class="panelHead">
        <h2>${esc(name)} <span style="color:#7a8fa1;font-size:11px;font-weight:400">
          ${esc(list[0].model || "")}</span></h2>
        <div style="font-size:11px;color:var(--muted)">Massima
          <b class="${tempClass(maxT)}" style="font-size:14px">${fmtInt(maxT, " °C")}</b>
          <span class="sep">·</span>${serverFans.length} ventole</div>
      </div>
      <div style="padding:12px">
        <div class="heatGrid">${sorted.map((x) => {
          const c = heatColor(x.temperature_c);
          return `<div class="heatCell" style="background:${c.bg};color:${c.fg}"
            title="${esc(x.sensor_name)} — ${fmtInt(x.temperature_c, " °C")}">
            <small>${esc(x.sensor_name)}</small>
            <b>${fmtInt(x.temperature_c, "°")}</b></div>`;
        }).join("")}</div>
        ${serverFans.length ? `<div style="margin-top:12px">
          <div style="font-size:11px;color:var(--muted);margin-bottom:7px">Ventole</div>
          <div class="heatGrid">${serverFans.map((f) => {
            const v = num(f.speed_percent) || 0;
            const bg = v >= 80 ? "rgba(255,91,103,.24)" : v >= 60
              ? "rgba(255,189,61,.22)" : "rgba(25,230,161,.16)";
            const fg = v >= 80 ? "#ff8a92" : v >= 60 ? "#ffcf72" : "#6ff0c4";
            return `<div class="heatCell" style="background:${bg};color:${fg}">
              <small>${esc(f.fan_name || f.fan_id)}</small><b>${fmtInt(v, "%")}</b></div>`;
          }).join("")}</div></div>` : ""}
      </div></div>`;
  }).join("")}`;
}

/* ============================================================
   Pagina Dischi: tutti i dischi fisici di tutti i server
   ============================================================ */

// num(null) vale 0, e un disco senza dato non e' un disco esaurito.
function vitaNum(x){
  const v = x.media_life_left_percent;
  return v === null || v === undefined || v === "" ? null : num(v);
}

// "Slot=12:Port=1I:Box=1:Bay=2" diventa "1I:1:2", la notazione che
// HPE usa ovunque e che SmartStorage riporta gia' cosi'.
function bayLabel(x){
  const raw = String(x.bay || x.drive_id || "");
  const m = raw.match(/Port=([^:]+):Box=([^:]+):Bay=([^:]+)/i);
  return m ? `${m[1]}:${m[2]}:${m[3]}` : raw;
}

// SmartStorage dichiara l'usura consumata. Un valore oltre 100 non e'
// un'usura vera: e' il caso documentato da HPE "SmartSSD Wear Gauge log
// is full". Dopo circa tre anni di funzionamento un registro specifico
// HPE si riempie e i suoi dati (usura, ore di accensione) diventano
// inattendibili; il disco funziona normalmente e non va sostituito per
// questo. L'usura vera resta leggibile dal sistema operativo via SMART.
function oltreNominale(x){
  const u = num(x.endurance_used_percent);
  return vitaNum(x) === null && u !== null && u > 100 ? u : null;
}

// Dischi letti da Windows (script sul server): hanno i contatori SMART.
function daWindows(x){ return String(x.source || "") === "os"; }

function erroriSmart(x){
  const e = num(x.uncorrected_errors);
  return e !== null && e > 0 ? e : 0;
}

// Riga sotto la capacita': ore, temperatura, errori.
function dettagliSmart(x){
  const parti = [];
  if (oreAccensione(x)) parti.push(oreAccensione(x));
  const t = num(x.temperature_c);
  if (t !== null && t > 0) parti.push(fmtInt(t, " °C"));
  const e = erroriSmart(x);
  if (e) parti.push(`<span class="warntxt">${e} errori</span>`);
  return parti.join(" · ");
}

// Tutti i contatori SMART, per il suggerimento al passaggio del mouse.
function tooltipSmart(x){
  let s = {};
  try { s = JSON.parse(x.smart_json || "{}") || {}; } catch (e){ s = {}; }
  if (Array.isArray(s.righe) && s.righe.length){
    return "SMART letto da Windows\n" + s.righe.map((r) => r[0] + ": " + r[1]).join("\n");
  }
  const etichette = [
    ["usura", "Usura (%)"], ["temperatura", "Temperatura °C"],
    ["temperatura_max", "Temperatura massima °C"],
    ["ore_accensione", "Ore di accensione"], ["cicli_accensione", "Cicli di accensione"],
    ["errori_lettura", "Errori di lettura non corretti"],
    ["errori_scrittura", "Errori di scrittura non corretti"],
    ["errori_lettura_corretti", "Errori di lettura corretti"],
    ["errori_scrittura_corretti", "Errori di scrittura corretti"],
    ["latenza_lettura_max_ms", "Latenza lettura max (ms)"],
    ["latenza_scrittura_max_ms", "Latenza scrittura max (ms)"],
    ["firmware", "Firmware"], ["bus", "Collegamento"], ["posizione", "Posizione"],
  ];
  const righe = etichette
    .filter(([k]) => s[k] !== undefined && s[k] !== null && s[k] !== "")
    .map(([k, nome]) => `${nome}: ${s[k]}`);
  if (!righe.length) return "";
  return "SMART letto da Windows\n" + righe.join("\n");
}

function oreAccensione(x){
  // Con il registro HPE pieno anche le ore sono inattendibili.
  if (oltreNominale(x) !== null) return "";
  const h = num(x.power_on_hours);
  if (h === null) return "";
  return `<span title="${h.toLocaleString("it-IT")} ore di accensione">${durataOre(h)}</span>`;
}

// 44844 ore -> "5,1 anni"; sotto l'anno mesi, sotto il mese giorni.
function durataOre(h){
  if (h >= 8760){
    const anni = h / 8760;
    return anni.toLocaleString("it-IT", {maximumFractionDigits: 1}) + (anni < 1.05 ? " anno" : " anni");
  }
  if (h >= 720){
    const mesi = Math.round(h / 730);
    return mesi + (mesi === 1 ? " mese" : " mesi");
  }
  if (h >= 48) return Math.round(h / 24) + " giorni";
  return Math.round(h) + " ore";
}

function isHdd(x){
  const t = String(x.media_type || "").toUpperCase();
  return t === "HDD" || (t !== "SSD" && (num(x.rotation_rpm) || 0) > 0);
}

// "ok", "warn", "bad" o "" (nessun giudizio possibile) per un disco.
function statoDisco(x, soglie){
  const h = health(x.health);
  const vita = vitaNum(x);
  if (x.failure_predicted || h === "bad") return "bad";
  if (vita !== null && vita <= soglie.crit) return "bad";
  if (h === "warn") return "warn";
  if (erroriSmart(x)) return "warn";
  if (vita !== null && vita <= soglie.warn) return "warn";
  return h === "ok" ? "ok" : "";
}

// Classe del pallino di stato: solo la salute riportata dal disco.
function salute(x){
  if (x.failure_predicted) return "statusBad";
  const h = health(x.health);
  return h === "bad" ? "statusBad" : h === "warn" ? "statusWarn" : h === "ok" ? "statusOk" : "";
}

function etichettaStato(x){
  if (x.failure_predicted) return "Guasto previsto";
  return x.health || x.state || "—";
}

function vitaDisco(x, soglie, perScheda){
  const vita = vitaNum(x);
  const oltre = oltreNominale(x);
  if (oltre !== null){
    return `<span class="lifeNa lifeOver" title="Il registro HPE SmartSSD Wear Gauge del disco è pieno (valore riportato: ${fmtInt(oltre, "%")}, non attendibile). Secondo HPE capita ai dischi con più di tre anni di funzionamento: il disco funziona normalmente e non va sostituito per questo. L'usura reale si legge dal sistema operativo tramite SMART.">registro HPE pieno</span>`;
  }
  if (vita === null && !x.media_type && num(x.rotation_rpm) === null){
    // Tipo sconosciuto (iLO 2): non si puo' dire se manca un dato.
    return '<span class="lifeNa" title="L\'iLO non riporta tipo né usura di questo disco">n/d</span>';
  }
  if (vita === null){
    return isHdd(x)
      ? '<span class="lifeNa" title="I dischi meccanici non hanno un indicatore di usura">n/d (HDD)</span>'
      : '<span class="lifeNa" title="Il controller non riporta l\'usura di questo SSD">non riportata</span>';
  }
  const cls = vita <= soglie.crit ? "bad" : vita <= soglie.warn ? "warn" : "";
  const larghezza = Math.max(2, Math.min(100, vita));
  const testo = `<b class="${cls === "bad" ? "redtxt" : cls === "warn" ? "warntxt" : "oktxt"}">${fmtInt(vita, " %")}</b>`;
  const barra = `<span class="bar"><i class="${cls}" style="width:${larghezza}%"></i></span>`;
  return perScheda ? barra + testo : `<span class="lifeCell">${barra}${testo}</span>`;
}

function dischiFiltrati(data){
  const v = state.drivesView;
  const soglie = {warn: num(data.life_warning) ?? 30, crit: num(data.life_critical) ?? 10};
  const q = (state.query || "").toLowerCase();
  let rows = presenti(data.drives || []);
  if (q){
    rows = rows.filter((x) => [x.server_name, x.model, x.serial_number, x.bay, x.ilo_ip]
      .some((c) => String(c || "").toLowerCase().includes(q)));
  }
  if (v.filtro === "ssd") rows = rows.filter((x) => !isHdd(x));
  else if (v.filtro === "hdd") rows = rows.filter(isHdd);
  else if (v.filtro === "attenzione")
    rows = rows.filter((x) => ["warn", "bad"].includes(statoDisco(x, soglie)));
  if (v.ordine === "server"){
    rows = rows.slice().sort((a, b) =>
      String(a.server_name).localeCompare(String(b.server_name), "it")
      || String(a.bay || a.drive_id).localeCompare(String(b.bay || b.drive_id), "it",
           {numeric: true}));
  }
  // altrimenti resta l'ordine del server: vita crescente, ignota in fondo
  return {rows, soglie};
}

function drivesPage(data){
  const tutti = presenti(data.drives || []);
  const senzaDati = data.servers_without_data || [];
  if (!tutti.length){
    return `<div class="panel"><div class="empty"><b>Nessun disco rilevato</b>
      L'inventario dello storage si aggiorna ogni ora; per leggerlo subito
      esegui una raccolta completa.</div></div>`;

  const v = state.drivesView;

  const ssd = tutti.filter((x) => !isHdd(x));
  const conVita = tutti.filter((x) => vitaNum(x) !== null);
  const peggiore = conVita.slice().sort((a, b) =>
    vitaNum(a) - vitaNum(b))[0];
  const daControllare = tutti.filter((x) => ["warn", "bad"].includes(statoDisco(x, soglie)));
  const critici = daControllare.filter((x) => statoDisco(x, soglie) === "bad");
  const serverCount = new Set(tutti.map((x) => x.server_id)).size;
  const vitaMin = peggiore ? vitaNum(peggiore) : null;
  const clsMin = vitaMin === null ? "blue" : vitaMin <= soglie.crit ? "red"

  const icoVita = '<svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="7" width="18" height="10" rx="2"/><path d="M22 11v2"/><path d="M6 11v2"/></svg>';
  const icoAvv = '<svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17h.01"/></svg>';
  const icoServer = '<svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="6" rx="1.5"/><rect x="3" y="14" width="18" height="6" rx="1.5"/><path d="M7 7h.01M7 17h.01"/></svg>';

  const opt = (val, testo, cur) =>
    `<option value="${val}" ${cur === val ? "selected" : ""}>${testo}</option>`;

  return `<div class="kpis drvKpis">
    <div class="kpi blue">
      <div class="kpiTop"><div class="kpiIcon">${icoDisco}</div><div>
        <div class="kpiValue">${tutti.length}</div>
        <div class="kpiLabel">Dischi fisici</div></div></div>
      <div class="kpiSub">${ssd.length} SSD <span class="sep">|</span>
        ${tutti.length - ssd.length} HDD</div>
    </div>
    <div class="kpi ${clsMin}">
      <div class="kpiTop"><div class="kpiIcon">${icoVita}</div><div>
        <div class="kpiValue">${vitaMin === null ? "—" : fmtInt(vitaMin, " %")}</div>
        <div class="kpiLabel">Vita residua minima</div></div></div>
      <div class="kpiSub">${peggiore
        ? esc(peggiore.server_name) + ' <span class="sep">|</span> bay ' + esc(bayLabel(peggiore))
        : "nessun SSD riporta l'usura"}</div>
    </div>
    <div class="kpi ${critici.length ? "red" : daControllare.length ? "amber" : "green"}">
      <div class="kpiTop"><div class="kpiIcon">${icoAvv}</div><div>
        <div class="kpiValue">${daControllare.length}</div>
        <div class="kpiLabel">Da controllare</div></div></div>
      <div class="kpiSub">guasto previsto, stato non OK, errori o vita &le; ${soglie.warn}%</div>
    </div>
    <div class="kpi green">
      <div class="kpiTop"><div class="kpiIcon">${icoServer}</div><div>
        <div class="kpiValue">${serverCount}</div>
        <div class="kpiLabel">Server con dati</div></div></div>
      <div class="kpiSub">${senzaDati.length
        ? "senza inventario: " + senzaDati.map((s) => esc(s.name || s.ilo_ip)).join(", ")
        : "tutti i server abilitati"}</div>
    </div>
  </div>

  <div class="pageToolbar">
    <div><h2>Dischi fisici</h2>
      <div class="sub">${rows.length === tutti.length ? tutti.length + " dischi"
        : rows.length + " di " + tutti.length + " dischi"} ·
        soglie vita: attenzione &le; ${soglie.warn}%, critica &le; ${soglie.crit}%</div></div>
    <div class="toolbarControls">
      <select class="field" id="drvFiltro" aria-label="Filtro">
        ${opt("tutti", "Tutti i dischi", v.filtro)}
        ${opt("attenzione", "Solo da controllare", v.filtro)}
        ${opt("ssd", "Solo SSD", v.filtro)}
        ${opt("hdd", "Solo HDD", v.filtro)}
      </select>
      <select class="field" id="drvOrdine" aria-label="Ordinamento">
        ${opt("vita", "Per vita residua", v.ordine)}
        ${opt("server", "Per server", v.ordine)}
      </select>
    </div>
  </div>

  <div class="panel" id="drivesPanel">${drivesList(rows, soglie)}</div>`;
}

function drivesList(rows, soglie){
  if (!rows.length) return '<div class="empty">Nessun disco corrisponde al filtro.</div>';
  return `<div class="boxBody flush driveTable"><table class="dataTable">
    <thead><tr><th>Server</th><th>Bay</th><th>Modello</th><th>Seriale</th>
      <th>Tipo</th><th>Capacità</th><th>Vita residua</th><th>Stato</th></tr></thead>
    <tbody>${rows.map((x) => {
      const sa = salute(x);
      return `<tr>
        <td><button class="linkBtn" data-drive-server="${x.server_id}">${esc(x.server_name || x.ilo_ip)}</button></td>
        <td class="nowrap" title="${esc(x.bay || "")}">${esc(bayLabel(x))}</td>
        <td title="${esc(tooltipSmart(x))}">${esc(x.model || "—")}${daWindows(x)
          ? ' <span class="fonteWin">Windows</span>' : ""}</td>
        <td><span class="serialTxt">${esc(x.serial_number || "—")}</span></td>
        <td class="nowrap">${esc(x.media_type || (isHdd(x) ? "HDD" : "—"))}${x.protocol
          ? " · " + esc(x.protocol) : ""}</td>
        <td class="nowrap">${tb(x.capacity_bytes)}${dettagliSmart(x)
          ? `<div class="subLine">${dettagliSmart(x)}</div>` : ""}</td>
        <td>${vitaDisco(x, soglie)}</td>
        <td class="nowrap ${sa}">● ${esc(etichettaStato(x))}</td>
      </tr>`;
    }).join("")}</tbody></table></div>
  <div class="driveCards">${rows.map((x) => schedaDisco(x, soglie, true)).join("")}</div>`;
}

function schedaDisco(x, soglie, conServer){
  const st = statoDisco(x, soglie);
  const meta = [
    x.serial_number ? "S/N " + esc(x.serial_number) : "",
    esc(x.media_type || (isHdd(x) ? "HDD" : "")),
    x.protocol ? esc(x.protocol) : "",
    tb(x.capacity_bytes),

const CHART_COLORS = ["#45a8ff", "#19e6a1", "#ffbd3d", "#a77cff", "#ff5b67",
  "#5ad1c8", "#f08bd0", "#9fd356"];

function buildSeries(rows, valueKey, servers){
  const byServer = {};
  rows.forEach((r) => {
    (byServer[r.server_id] = byServer[r.server_id] || []).push(
      {x: r.bucket, y: num(r[valueKey])});
  });
  return Object.entries(byServer).map(([id, points], idx) => {
    const server = servers.find((s) => String(s.id) === String(id));
    return {
      name: server ? server.name : ("Server " + id),
      color: CHART_COLORS[idx % CHART_COLORS.length],
      points: points.filter((p) => p.y !== null)
    };
  }).filter((s) => s.points.length);
}

    <div class="box"><div class="boxHead">Consumo elettrico (W)</div>

        : emptyBox("Nessuna rilevazione nel periodo.")}</div></div>
    <div class="box"><div class="boxHead">Temperatura massima (°C)</div>
      <div class="boxBody">${tempSeries.length ? lineChart(tempSeries, "°C", 200)
        : emptyBox("Nessuna rilevazione nel periodo.")}</div></div>
  </div>

  <div class="grid2" style="margin-top:12px">
    <div class="box"><div class="boxHead">Utilizzo CPU (%)</div>
      <div class="boxBody">${cpuSeries.length ? lineChart(cpuSeries, "%", 200)

    <div class="box"><div class="boxHead">Eventi per giorno</div>
      <div class="boxBody flush">${(data.events_by_day || []).length ? `<table class="dataTable">
        <thead><tr><th>Giorno</th><th>Totali</th><th>Warning</th><th>Critical</th></tr></thead>
        <tbody>${(data.events_by_day || []).slice().reverse().map((d) => `<tr>

    <div class="boxBody flush">${totals.length ? `<table class="dataTable">
      <thead><tr><th>Server</th><th>Consumo medio</th><th>Minimo</th><th>Massimo</th>

async function exportCsv(){
  try {
    const data = await apiData("/api/reports?hours=" + state.reportHours);
    const lines = ["server;consumo_medio_W;minimo_W;massimo_W;rilevazioni"];
    (data.totals || []).forEach((t) => {
      lines.push([t.name, Math.round(num(t.avg_watts) || 0),
        Math.round(num(t.min_watts) || 0), Math.round(num(t.max_watts) || 0),
        t.samples || 0].join(";"));
    });
    const blob = new Blob(["\ufeff" + lines.join("\n")],
      {type: "text/csv;charset=utf-8"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "ilo-monitor-consumi-" + state.reportHours + "h.csv";
    a.click();
    URL.revokeObjectURL(url);
  } catch (err){ toast("Esportazione non riuscita: " + err.message, "err"); }
}
