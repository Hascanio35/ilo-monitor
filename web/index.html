function wireAlertsPage(){
  const msg = $("smtpMsg");

  function datiSmtp(){
    const d = {
      smtp_enabled: $("smtpEnabled").checked ? 1 : 0,
      smtp_host: $("smtpHost").value.trim(),
      smtp_port: Number($("smtpPort").value),
      smtp_security: $("smtpSecurity").value,
      smtp_user: $("smtpUser").value.trim(),
      smtp_from: $("smtpFrom").value.trim(),
      smtp_to: $("smtpTo").value.trim(),
      alert_max_per_run: Number($("alertMax").value)
    };
    if ($("smtpPassword").value) d.smtp_password = $("smtpPassword").value;
    return d;
  }

  async function salvaSmtp(){
    await api("/api/alerts/smtp", {method: "PUT", body: datiSmtp()});
    $("smtpPassword").value = "";
  }

  collega($("saveSmtp"), "click", async () => {
    msg.className = "formMessage";
    msg.textContent = "Salvataggio…";
    try {
      await salvaSmtp();
      msg.className = "formMessage ok";
      msg.innerHTML = "<b>✓ Configurazione salvata</b>";
      toast("Configurazione email salvata");
    } catch (err){
      msg.className = "formMessage err";
      msg.innerHTML = "<b>✕ Salvataggio non riuscito</b><br>" + esc(err.message);
    }
  });

  const bottoneTest = $("testEmail");

  function esito(ok, titolo, dettaglio){
    msg.className = "formMessage " + (ok ? "ok" : "err");
    msg.innerHTML = `<b>${ok ? "✓" : "✕"} ${esc(titolo)}</b>`
      + (dettaglio ? "<br>" + esc(dettaglio) : "");
    bottoneTest.textContent = "Invia messaggio di prova";
    bottoneTest.disabled = false;
  }

  collega(bottoneTest, "click", async () => {
    // Controlli qui, prima di disturbare il server: dicono subito
    // cosa manca invece di far attendere un errore SMTP.
    const mancanti = [];
    if (!$("smtpHost").value.trim()) mancanti.push("il server SMTP");
    if (!$("smtpTo").value.trim()) mancanti.push("il destinatario");
    if (mancanti.length){
      esito(false, "Test fallito",
        "Manca " + mancanti.join(" e ") + ".");
      return;
    }
    const destinatario = $("smtpTo").value.trim();
    if (!/^[^@\s,]+@[^@\s,]+\.[^@\s,]+/.test(destinatario)){
      esito(false, "Test fallito",
        "L'indirizzo del destinatario non sembra valido.");
      return;
    }

    bottoneTest.disabled = true;
    bottoneTest.textContent = "Invio in corso…";
    msg.className = "formMessage";
    msg.textContent = "Salvo la configurazione e provo l'invio…";

    try {
      // Salviamo prima: altrimenti la prova userebbe i valori
      // precedenti e il risultato non direbbe nulla su quelli
      // appena digitati.
      await salvaSmtp();
      const r = await api("/api/alerts/test", {method: "POST"});
      if (r.ok){
        esito(true, "Test effettuato con successo", r.message);
        toast("Messaggio di prova inviato");
      } else {
        esito(false, "Test fallito", r.error);
      }
    } catch (err){
      esito(false, "Test fallito", err.message);
    }
    // Volutamente nessun ridisegno della pagina: cancellerebbe
    // quello che c'e' nei campi.
  });

  els("[data-rule]").forEach((riquadro) => {
    const id = riquadro.dataset.rule;
    const nota = el("[data-msg]", riquadro);

    const corpo = () => {
      const body = {min_severity: el("[data-sev]", riquadro).value};
      els("[data-f]", riquadro).forEach((c) => {
        body[c.dataset.f] = c.checked;
      });
      return body;
    };

    async function salva(tutti){
      const body = corpo();
      if (tutti) body.apply_to_all = true;
      nota.textContent = "Salvataggio…";
      try {
        const r = await api("/api/alerts/rules/" + id,
          {method: "PUT", body});
        nota.textContent = r.message || "Salvato.";
        toast(r.message || "Impostazioni salvate");
        if (tutti) render();
      } catch (err){
        nota.textContent = err.message;
      }
    }

    collega(el("[data-save]", riquadro), "click", () => salva(false));
    collega(el("[data-all]", riquadro), "click", () => {
      if (confirm("Applicare queste impostazioni a tutti i server?")) salva(true);
    });
  });
}

function wireSettingsPage(){
  const msg = $("settingsMsg");
  collega($("saveSettings"), "click", async () => {
    msg.className = "formMessage";
    msg.textContent = "Salvataggio…";
    try {
      const body = {
        temp_warning_c: Number($("setWarn").value),
        temp_critical_c: Number($("setCrit").value),
        collect_interval_minutes: Number($("setInterval").value),
        ui_refresh_seconds: Number($("setRefresh").value),
        retention_days: Number($("setRetention").value),
        ignore_login_events: $("setIgnoreLogin").checked ? 1 : 0,
        inventory_interval_minutes: Number($("setInventory").value)
      };
      if (body.temp_warning_c >= body.temp_critical_c){
        msg.className = "formMessage err";
        msg.textContent = "La soglia warning deve essere inferiore alla soglia critical.";
        return;
      }
      await api("/api/settings", {method: "PUT", body});
      state.settings.tempWarn = body.temp_warning_c;
      state.settings.tempCrit = body.temp_critical_c;
      state.settings.refresh = body.ui_refresh_seconds;
      state.countdown = body.ui_refresh_seconds;
      msg.className = "formMessage ok";
      msg.textContent = "Impostazioni salvate.";
      toast("Impostazioni salvate");
    } catch (err){
      msg.className = "formMessage err";
      msg.textContent = "Salvataggio non riuscito: " + err.message;
    }
  });
  const pwMsg = $("pwMsg");
  collega($("savePassword"), "click", async () => {
    pwMsg.className = "formMessage";
    if ($("pwNew").value !== $("pwRepeat").value){
      pwMsg.className = "formMessage err";
      pwMsg.textContent = "Le due nuove password non coincidono.";
      return;
    }
    pwMsg.textContent = "Salvataggio…";
    try {
      await api("/api/change-password", {method: "POST", body: {
        current_password: $("pwCurrent").value,
        new_password: $("pwNew").value
      }});
      ["pwCurrent", "pwNew", "pwRepeat"].forEach((id) => { $(id).value = ""; });
      pwMsg.className = "formMessage ok";
      pwMsg.textContent = "Password aggiornata. Le altre sessioni aperte "
        + "sono state chiuse.";
      toast("Password aggiornata");
    } catch (err){
      pwMsg.className = "formMessage err";
      pwMsg.textContent = err.message;
    }
  });
  collega($("purgeLoginBtn"), "click", async () => {
    if (!confirm("Rimuovere dall'archivio gli eventi di accesso all'iLO "
      + "gia' salvati? Restano comunque nel log dell'iLO.")) return;
    try {
      const r = await api("/api/maintenance/purge-login-events",
        {method: "POST"});
      toast(r.message || "Eventi rimossi");
      render();
    } catch (err){ toast(err.message, "err"); }
  });
  collega($("purgeBtn"), "click", async () => {
    if (!confirm("Eliminare le rilevazioni oltre il periodo di conservazione?")) return;
    try {
      await api("/api/maintenance/purge", {method: "POST"});
      toast("Pulizia dello storico avviata");
    } catch (err){ toast(err.message, "err"); }
  });
  collega($("collectAllBtn"), "click", async () => {
    try {
      const r = await api("/api/collect", {method: "POST"});
      toast(r.message || "Raccolta avviata");
      setTimeout(() => refreshAll(true), 20000);
    } catch (err){ toast(err.message, "err"); }
  });
}

            <input name="ilo_user" required maxlength="150"
              value="${esc(server ? server.ilo_user : "Administrator")}"></label>
          <label>Password iLO
            <input name="ilo_password" type="password"
              placeholder="${editing ? "lascia vuoto per non modificarla" : ""}"
              ${editing ? "" : "required"} autocomplete="new-password">

          </label>
          <label>Gruppo (facoltativo)
            <input name="server_group" maxlength="100" placeholder="Sede principale"
              value="${esc(server && server.server_group ? server.server_group : "")}"></label>
          <label>Monitoraggio

        </div>
      </form>
    </div>
  </div>`;

  const form = $("serverForm");
  const msg = $("serverFormMsg");
  const submitBtn = $("submitBtn");

  const readForm = () => {
    const data = Object.fromEntries(new FormData(form).entries());
    data.enabled = form.querySelector("[name=enabled]").checked;
    return data;
  };

  collega($("modalCloseBtn"), "click", closeModal);
  collega($("cancelBtn"), "click", closeModal);
  collega($("serverModal"), "click", (ev) => {
    if (ev.target.id === "serverModal") closeModal();
  });

  collega($("testBtn"), "click", async () => {
    const data = readForm();
    if (!data.ilo_ip){
      msg.className = "formMessage err";
      msg.textContent = "Indica l'indirizzo IP dell'iLO.";
      return;
    }
    msg.className = "formMessage";
    msg.textContent = "Connessione in corso…";
    try {
      const body = {ilo_ip: data.ilo_ip, ilo_user: data.ilo_user};
      if (data.ilo_password) body.ilo_password = data.ilo_password;
      else if (editing) body.server_id = server.id;
      const r = await api("/api/servers/test", {method: "POST", body});
      if (r.ok){
        const d = r.data;
        msg.className = "formMessage ok";
        msg.textContent = `Connessione riuscita: ${d.model || "server"}`
          + ` · SN ${d.serial_number || "—"} · ${d.ilo_version || "iLO"}`
          + ` · salute ${d.overall_health || "—"}`;
        if (!form.name.value && d.hostname) form.name.value = d.hostname;
      } else {
        msg.className = "formMessage err";
        msg.textContent = "Connessione non riuscita: " + r.error;
      }
    } catch (err){
      msg.className = "formMessage err";
      msg.textContent = "Connessione non riuscita: " + err.message;
    }

  collega(form, "submit", async (ev) => {
    ev.preventDefault();
    const data = readForm();
    msg.className = "formMessage";
    msg.textContent = editing ? "Salvataggio…"
      : "Verifica delle credenziali e salvataggio…";
    submitBtn.disabled = true;
    try {
      if (editing){
        const body = {
          name: data.name, ilo_ip: data.ilo_ip, ilo_user: data.ilo_user,
          server_group: data.server_group || "", notes: data.notes || "",
          enabled: data.enabled
        };
        if (data.ilo_password) body.ilo_password = data.ilo_password;
        await api("/api/servers/" + server.id, {method: "PUT", body});
        toast(data.name + " aggiornato");
      } else {
        const r = await api("/api/servers", {method: "POST", body: {
          name: (data.name || "").trim() || null,
          ilo_ip: data.ilo_ip, ilo_user: data.ilo_user,
          ilo_password: data.ilo_password, server_group: data.server_group || null,
          notes: data.notes || null, enabled: data.enabled
        }});
        state.selectedId = r.id;
        state.detail = null;
        toast(r.message || "Server aggiunto");
        // La prima raccolta gira in background: ricarichiamo tra poco.
        setTimeout(() => refreshAll(true), 15000);
      }
      closeModal();
      await refreshAll(true);
    } catch (err){
      msg.className = "formMessage err";
      msg.textContent = err.message;
      submitBtn.disabled = false;
    }
  });

  // In aggiunta il campo che conta e' l'indirizzo: il nome puo'
  // arrivare dall'iLO.
  const first = form.querySelector(
    editing ? "input[name=name]" : "input[name=ilo_ip]");
  if (first) first.focus();
}

function nomeFileAgente(server){

}

function openAgentModal(server){
  const file = nomeFileAgente(server);
  const comando = `powershell -ExecutionPolicy Bypass -File .\\${file} -Installa`;
  const stato = server.has_agent
    ? (server.agent_last_at
        ? `Ultimo invio <b>${relative(server.agent_last_at)}</b>${server.agent_host
            ? " da <b>" + esc(server.agent_host) + "</b>" : ""}.`
        : "Script generato, ma non ha ancora inviato dati.")
    : "Nessuno script installato per questo server.";
  $("modalRoot").innerHTML = `
  <div class="modal" id="agentModal">
    <div class="modalCard" style="width:min(620px,96vw)">
      <div class="modalHead">
        <div><h2>Dischi e SMART da Windows</h2>
          <p>Lo script legge da Windows tutti i dischi fisici di ${esc(server.name)},
             anche quelli che l'iLO non vede (per esempio gli NVMe su scheda PCIe),
             con usura, temperatura, ore di accensione ed errori, e li invia
             al pannello ogni ora.</p></div>
        <button class="modalClose" id="agClose">×</button>
      </div>
      <div class="formGrid">
        <div class="wide hint" style="font-size:12px;color:#c3d2dd">${stato}</div>
        ${server.has_agent ? `<div class="wide formMessage" style="padding:0">

          installato smette di inviare finché non lo sostituisci.</div>` : ""}
        <div class="wide" style="font-size:12px;line-height:19px;color:#c3d2dd">
          <b>1.</b> Scarica lo script e copialo sul server Windows.<br>
          <b>2.</b> Apri PowerShell <b>come amministratore</b> nella cartella
             dove l'hai copiato e lancia:
          <pre class="codice" id="agCmd">${esc(comando)}</pre>
          Crea l'attività pianificata (ogni ora e all'avvio) e invia subito i dati.
          Con <code>-Mostra</code> al posto di <code>-Installa</code> vedi cosa legge
          senza inviare nulla.
        </div>
      </div>
      <div class="formMessage" id="agMsg"></div>
      <div class="modalActions">
        <button class="action left" id="agCopy">Copia comando</button>

  </div>`;
  collega($("agClose"), "click", closeModal);
  collega($("agCancel"), "click", closeModal);
  collega($("agentModal"), "click", (ev) => {
    if (ev.target.id === "agentModal") closeModal();
  });
  collega($("agCopy"), "click", async () => {
    try {
      await navigator.clipboard.writeText(comando);
      toast("Comando copiato");
    } catch (e){
      // Senza HTTPS il browser puo' negare gli appunti: si seleziona il testo.
      const r = document.createRange();
      r.selectNodeContents($("agCmd"));

      toast("Comando selezionato: premi Ctrl+C", "warn");
    }
  });
  collega($("agGo"), "click", () => {
    const a = document.createElement("a");
    a.href = "/api/servers/" + server.id + "/agent-script";
    a.download = file;
    document.body.appendChild(a);
    a.click();
    a.remove();

    $("agMsg").textContent = "Script scaricato: " + file;

setInterval(() => {
  const timer = el(".timer");
  if (!autoaggiornamentoAttivo()){
    if (timer) timer.textContent = "Aggiornamento in pausa";

  }
  if (timer && !$("countdown")){

      + state.countdown + "</span> s";
  }
  state.countdown -= 1;
  if (state.countdown <= 0){
    state.countdown = state.settings.refresh;
    refreshAll(true);
  }
  const node = $("countdown");
  if (node) node.textContent = Math.max(0, state.countdown);

(async function start(){
  try {
    const utente = await apiData("/api/me");
    state.user = utente;
    $("userName").textContent = utente.full_name || utente.username;
    if (utente.must_change_password){
      toast("Cambia la password dalla pagina Impostazioni", "warn");
    }
  } catch (err){
    // Sessione scaduta fra il caricamento della pagina e questa
    // richiesta: torniamo al login invece di mostrare una pagina vuota.
    location.href = "/login";
    return;
  }
  try {
    const cfg = await apiData("/api/settings");
    const seconds = Number(cfg.settings && cfg.settings.ui_refresh_seconds);
    if (seconds >= 10){
      state.settings.refresh = seconds;
      state.countdown = seconds;
    }
  } catch (err){ /* valori predefiniti */ }
  try {
    await loadCore();
  } catch (err){
    toast("Connessione all'API non riuscita: " + err.message, "err");
  }
  await go("overview");
})();
</script>
